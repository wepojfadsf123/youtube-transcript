<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유튜브 대본 추출기</title><style>:root{font-family:Inter,Apple SD Gothic Neo,system-ui,sans-serif;color:#202124;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:65px auto;padding:0 22px}.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.mark{background:#f23b43;color:white;padding:8px 12px;border-radius:11px}h1{font-size:38px;letter-spacing:-1.6px;margin:38px 0 12px}p{color:#70757a;line-height:1.6}.panel{background:white;border:1px solid #e6e8ec;border-radius:22px;padding:28px;margin-top:30px;box-shadow:0 8px 35px #18212f09}.label{font-weight:700;margin-bottom:12px}input[type=url]{width:100%;padding:17px;border:1px solid #d8dce2;border-radius:12px;font-size:15px}input:focus{outline:2px solid #f9b6ba;border-color:#ef535b}.controls{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0;color:#555}button{border:0;border-radius:11px;background:#ef444b;color:white;padding:14px 23px;font-weight:700;cursor:pointer}button.secondary{background:#f1f2f5;color:#333}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:9px;flex-wrap:wrap}.status{margin-top:17px;font-size:14px;color:#666;min-height:22px}.status.error{color:#d22}.result{display:none}.result.show{display:block}textarea{width:100%;min-height:360px;border:1px solid #e1e3e8;border-radius:12px;padding:18px;resize:vertical;line-height:1.75;font-size:14px;background:#fcfcfd}.meta{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:14px}small{color:#868a91}.hint{background:#fff7ed;border:1px solid #fed7aa;padding:14px 17px;border-radius:12px;margin-top:20px;color:#805020;font-size:13px;line-height:1.6}@media(max-width:600px){h1{font-size:29px}.panel{padding:19px}.wrap{margin:35px auto}}</style></head><body><main class="wrap"><div class="logo"><span class="mark">▶</span> Scriptly <small>유튜브 대본 추출기</small></div><h1>유튜브 영상을<br>읽을 수 있는 대본으로.</h1><p>영상 링크를 붙여넣고 자막을 추출하세요. 타임코드를 포함하거나 제외해서 복사하고 저장할 수 있습니다.</p><section class="panel"><div class="label">유튜브 영상 URL</div><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"><div class="controls"><label><input type="checkbox" id="timestamps" checked> 타임코드 표시</label><label><input type="checkbox" id="dedupe" checked> 중복 자막 정리</label></div><button id="extract">대본 추출하기 →</button><div id="status" class="status" aria-live="polite"></div><div class="hint">이 사이트는 서버 API가 연결되어야 실제 자막을 추출합니다. 영상에 공개 자막이 없거나 접근이 제한된 경우 추출되지 않을 수 있습니다.</div></section><section id="result" class="panel result"><div class="meta"><div><div class="label" id="title">추출된 대본</div><small id="count"></small></div><div class="actions"><button class="secondary" id="copy">복사</button><button class="secondary" id="download">TXT 저장</button></div></div><textarea id="transcript" aria-label="추출된 대본"></textarea></section></main><script>const $=id=>document.getElementById(id);let entries=[];function vid(url){try{const u=new URL(url);if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/live/'))return u.pathname.split('/')[2]}}catch{}return null}function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);return '['+(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+']'}function render(){let a=entries;if($('dedupe').checked)a=a.filter((e,i)=>i===0||e.text.trim()!==a[i-1].text.trim());$('transcript').value=a.map(e=>($('timestamps').checked?fmt(e.start)+' ':'')+e.text).join('\n');$('count').textContent=a.length+'개 자막 구간'}$('extract').onclick=async()=>{const id=vid($('url').value.trim());const status=$('status');status.className='status';if(!id||!/^[\w-]{11}$/.test(id)){status.textContent='올바른 유튜브 영상 주소를 입력해 주세요.';status.classList.add('error');return}const btn=$('extract');btn.disabled=true;status.textContent='자막을 불러오는 중...';$('result').classList.remove('show');try{const r=await fetch('/api/transcript?videoId='+encodeURIComponent(id));const data=await r.json();if(!r.ok)throw Error(data.error||'자막을 불러오지 못했습니다.');entries=data.entries||[];if(!entries.length)throw Error('추출 가능한 자막이 없습니다.');$('title').textContent=data.title||'추출된 대본';render();$('result').classList.add('show');status.textContent='대본 추출 완료!'}catch(e){status.textContent=e.message+(e instanceof SyntaxError?' 서버 API가 연결되어 있는지 확인해 주세요.':'');status.classList.add('error')}finally{btn.disabled=false}};['timestamps','dedupe'].forEach(id=>$(id).onchange=render);$('copy').onclick=async()=>{await navigator.clipboard.writeText($('transcript').value);$('copy').textContent='복사 완료';setTimeout(()=>$('copy').textContent='복사',1500)};$('download').onclick=()=>{const blob=new Blob([$('transcript').value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='youtube-transcript.txt';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
